<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gestión de Adopciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{% url 'persona_list' %}">Gestión de Adopciones</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
        <li class="nav-item"><a class="nav-link" href="{% url 'mascota_list' %}">Mascotas</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'adopcion_list' %}">Adopciones</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'reportes' %}">Reportes</a></li>
        <li class="nav-item">
  <form action="{% url 'logout' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="nav-link btn btn-link" style="text-decoration:none;">Salir</button>
  </form>
</li>

        {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Ingresar</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'registro' %}">Registro</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
